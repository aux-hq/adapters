name: aux-dispatch

# The single tenant-facing reusable workflow.
#
# Tenants install one 5-line caller workflow that delegates to this. All future
# capability changes (new stage kinds, new runtimes, new gateway features) ship
# inside this repo and are picked up by tenants via the @v1 moving major tag —
# no further tenant-side PR is ever required.

on:
  workflow_call:
    inputs:
      payload:
        description: JSON-serialized client_payload from the tenant repository_dispatch event.
        type: string
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Checks out the scripts this workflow invokes. The ref MUST be the major
      # tag (`v1`), NOT `${{ github.workflow_sha }}`: in a reusable workflow,
      # `github.workflow_sha` resolves to the *caller's* workflow file SHA,
      # which is on the tenant's runtime repo and not on aux-hq/adapters at
      # all. There is no first-class context value for "the SHA the reusable
      # workflow was loaded at"; `v1` is what tenants pin and is the right
      # contract here. ci.yml enforces this to prevent regressions.
      - name: Checkout aux-hq/adapters
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: aux-hq/adapters
          ref: v1
          path: adapters

      - name: Parse wakeup
        env:
          AUX_PAYLOAD: ${{ inputs.payload }}
        run: ./adapters/shared/parse-wakeup.sh

      - name: Fetch dispatch
        run: ./adapters/shared/fetch-dispatch.sh

      - name: Dispatch by kind
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Resolved from the caller repo's Actions variables (e.g. aux-hq/aux-runtime).
          # When "true", invoke.sh enables Claude Code --debug and streams logs to the GHA log.
          AUX_CLAUDE_DEBUG: ${{ vars.AUX_CLAUDE_DEBUG }}
        run: |
          set -euo pipefail
          case "$AUX_KIND" in
            agent)
              ./adapters/kinds/agent.sh
              ;;
            script)
              ./adapters/kinds/script.sh
              ;;
            *)
              jq -nc \
                --arg outcome error \
                --arg reason "unknown kind" \
                --arg detail "Adapter does not support kind '$AUX_KIND'. Supported: agent, script." \
                '{outcome: $outcome, reason: $reason, detail: $detail}' \
                >"${RUNNER_TEMP}/aux-outcome.json"
              echo "dispatch: unsupported kind '$AUX_KIND'" >&2
              exit 1
              ;;
          esac

      - name: Post outcome
        if: always()
        run: ./adapters/shared/post-outcome.sh
